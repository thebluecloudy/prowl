# Prowl worker: deployed by Cloudflare Workers Builds on every push to main.
# Secrets (API keys, tokens, PRO_EMAILS, etc.) live only in the Cloudflare
# dashboard and are never stored here. keep_vars stops a deploy from wiping
# the plain-text variables that are set in the dashboard.

name = "prowl"
main = "index.js"
compatibility_date = "2026-09-21"
workers_dev = true
preview_urls = false
keep_vars = true

[[kv_namespaces]]
binding = "PROWL_ALERTS"
id = "102ebd733ced41f3806399872dd19027"

# v48: counters and the response cache live in a Durable Object. The Cache API
# does nothing on workers.dev, so the daily caps were never enforced before this.
[[durable_objects.bindings]]
name = "CAPS"
class_name = "Caps"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Caps"]

# Every 5 minutes: the Prowl Alerts clock. "2 * * * *" (v78): the hourly uptime test searches for the admin
# dashboard, in their own run so they never use the alert clock's budget of outside calls. index.js PROBE_CRON
# must match the second entry.
[triggers]
crons = ["*/5 * * * *", "2 * * * *"]

[vars]
EPN_CAMPAIGN_ID = "5339216838"
# Prowl Alerts sign-ups: "beta" = only ALERT_ALLOW emails (while Alerts/Pro are
# being finished; page v5.85 shows "Coming soon"). Set "public" to launch.
ALERTS = "public"
# Mailing address in every Prowl Alerts email footer (required by CAN-SPAM).
ALERT_ADDRESS = "Owl & Twig Vintage · 6311 Haggerty Rd, Unit #699 · West Bloomfield, MI 48322"
# v94: who may read the Facebook sweep's finds (GET /fb-finds): "owner" (only the owner key's devices; the sweep runs
# through Matthew's own Facebook account), "public" (every visitor whose hunt was swept), or "off". The page shows the
# strip only on owner devices unless its PROWL_FB_PUBLIC is also true.
FB_FINDS = "owner"

# v114: Prowl's own notifications (Web Push). The public half of the VAPID pair; the private half is the secret
# VAPID_PRIVATE_JWK (Cloudflare > Workers > prowl > Settings > Variables and secrets). The two must stay a pair: a new
# pair means every phone turns alerts on again. The subject is the Prowl page, not a person's address.
VAPID_PUBLIC = "BAyeoiDGno-hSAHVI14NcMvA9TkxHUkllcXS9lcBZ0x8Mvnfh38GJo85n0JNiFQinBC5XD9bBpkOtvnDhGtXVL0"
VAPID_SUBJECT = "https://www.owlandtwigvintage.com/pages/prowl"
