name: Deploy Prowl page to Shopify

# Upload any .html file into page/ (any name, e.g. "prowl (2).html") and it deploys.
# The file from the most recent commit that touched page/*.html is the one sent.
on:
  push:
    branches: [main]
    paths:
      - "page/*.html"
  workflow_dispatch:
    inputs:
      force:
        description: "Allow a file much smaller than the live page"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prowl-page-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pick the page file
        id: pick
        run: |
          f="$(git log -1 --format= --name-only --diff-filter=AM -- 'page/*.html' | head -n 1)"
          if [ -z "$f" ]; then f="page/prowl.html"; fi
          echo "Deploying: $f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - name: Send the page to Shopify and verify
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          FORCE: ${{ inputs.force || 'false' }}
          PAGE_FILE: ${{ steps.pick.outputs.file }}
        run: node scripts/deploy-page.mjs "$PAGE_FILE"
      - name: Keep the previous live page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-page-before-${{ github.run_number }}
          path: backup/
          if-no-files-found: ignore
          retention-days: 90
