name: SGW digest

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC = 8:30am EDT / 7:30am EST
  workflow_dispatch: {}     # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Scrape ShopGoodwill
        run: python sgw_scrape.py

      - name: Commit results
        run: |
          git config user.name "prowl-hunt"
          git config user.email "prowl-hunt@owlandtwigvintage.com"
          git add sgw-digest.json
          git diff --cached --quiet || git commit -m "SGW digest $(date -u +%F)"
          git push
