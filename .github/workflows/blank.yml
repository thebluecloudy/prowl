name: CI

# Checks the worker on every pull request and push to main: every file parses,
# and the unit tests in worker/__tests__ pass (Node's built-in test runner, no
# packages to install).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker files parse
        run: |
          mkdir -p /tmp/w && cp worker/*.js /tmp/w/ && echo '{"type":"module"}' > /tmp/w/package.json
          for f in /tmp/w/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test "worker/__tests__/*.test.mjs"
