name: CI

# Checks the worker, page and extension on every pull request and push to main:
# every file parses, the page has no Liquid openers, and the unit tests in
# worker/__tests__ and __tests__ pass (Node's built-in test runner). The page
# tests load page/prowl.html in jsdom, the one dev-only package (package.json).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # the suite runs about 4.5 min and grew past 5 (runs 357, 361, 362 cancelled mid-test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker files parse
        run: |
          mkdir -p /tmp/w && cp worker/*.js /tmp/w/ && echo '{"type":"module"}' > /tmp/w/package.json
          for f in /tmp/w/*.js; do node --check "$f"; done
      - name: Page parses, no Liquid openers
        run: node scripts/check-page.mjs page/prowl.html
      - name: Extension files parse
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Install test packages (jsdom, dev only)
        run: npm ci --no-audit --no-fund
      - name: Unit tests (worker, page, extension)
        run: npm test
