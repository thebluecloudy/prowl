name: Worker probe

# Calls one of the worker's __ diagnostic routes and prints the JSON, so a
# diagnostic can be run from GitHub (or from a Claude session) without a
# terminal. The key is masked in the log. Run it by hand from the Actions tab
# or through the API with the two inputs.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Route and query, e.g. /__vintedtest?q=jadeite+fire+king"
        required: true
        type: string
      key:
        description: "DEBUG_KEY (masked in the log)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the worker
        env:
          P: ${{ inputs.path }}
          K: ${{ inputs.key }}
        run: |
          echo "::add-mask::$K"
          case "$P" in /__*) ;; *) echo "path must start with /__"; exit 1;; esac
          echo "GET https://prowl.thebluecloud.workers.dev$P"
          echo "=====BEGIN====="
          curl -sS -m 60 -H "X-Prowl-Debug: $K" "https://prowl.thebluecloud.workers.dev$P"
          echo
          echo "=====END====="
