name: Worker probe

# Calls one of the worker's __ diagnostic routes and prints the JSON, so a
# diagnostic can be run from the Actions tab (or through the API) without a
# terminal. The key comes from the PROWL_DEBUG_KEY repository secret, which
# GitHub masks in the log. Set it under Settings > Secrets and variables >
# Actions, the same value as the worker's DEBUG_KEY.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Route and query, e.g. /__vintedtest?q=jadeite+fire+king or a public route like /ebay?q=jadeite"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the worker
        env:
          P: ${{ inputs.path }}
          K: ${{ secrets.PROWL_DEBUG_KEY }}
        run: |
          if [ -z "$K" ]; then echo "PROWL_DEBUG_KEY secret is not set"; exit 1; fi
          case "$P" in /__*|/ebay\?*|/etsy\?*|/chairish\?*|/poshmark\?*|/depop\?*|/vinted\?*|/grailed\?*|/\?*) ;; *) echo "path must start with /__ or be a live route like /ebay?q=..."; exit 1;; esac
          echo "GET https://prowl.thebluecloud.workers.dev$P"
          echo "=====BEGIN====="
          curl -sS -m 60 -i -H "X-Prowl-Debug: $K" -H "Origin: https://owlandtwigvintage.com" "https://prowl.thebluecloud.workers.dev$P" | head -c 3000
          echo
          echo "=====END====="
