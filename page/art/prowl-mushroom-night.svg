<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="pmSky" cx="50%" cy="62%" r="75%">
      <stop offset="0" stop-color="#123a2a"/>
      <stop offset=".45" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <radialGradient id="pmBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8ff9a" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#39ff14" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#39ff14" stop-opacity=".32"/>
      <stop offset=".75" stop-color="#1aff8c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1aff8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pmPool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dff4f" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#39ff14" stop-opacity=".2"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pmCap" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#d4ffb8"/>
      <stop offset=".55" stop-color="#5dff2e"/>
      <stop offset="1" stop-color="#2bd60f"/>
    </radialGradient>
    <linearGradient id="pmStem" x1="0" x2="1">
      <stop offset="0" stop-color="#5df2b4"/>
      <stop offset=".5" stop-color="#f0fff8"/>
      <stop offset="1" stop-color="#5df2b4"/>
    </linearGradient>
    <radialGradient id="pmFly" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4ffd0"/>
      <stop offset=".35" stop-color="#d4ff6a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#d4ff6a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pmClip"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#pmClip)">
    <rect width="100" height="100" fill="url(#pmSky)"/>
    <!-- stars + moon -->
    <g fill="#cfe9ff" opacity=".7">
      <circle cx="18" cy="9" r=".6"/><circle cx="42" cy="6" r=".5"/><circle cx="66" cy="10" r=".6"/><circle cx="83" cy="5" r=".5"/><circle cx="8" cy="20" r=".4"/>
    </g>
    <circle cx="84" cy="15" r="5" fill="#e8f3ff" opacity=".9"/><circle cx="86.2" cy="13.6" r="4.4" fill="#081226"/>
    <!-- far trees -->
    <g fill="#15384a">
      <path d="M-2 78 L6 34 L14 78 Z"/><path d="M12 80 L22 28 L32 80 Z"/><path d="M70 80 L79 30 L88 80 Z"/><path d="M84 78 L93 38 L102 78 Z"/>
    </g>
    <!-- near trees, lit edges -->
    <g fill="#081522">
      <path d="M-6 100 L4 22 L16 100 Z"/><path d="M84 100 L96 18 L108 100 Z"/>
    </g>
    <!-- bloom -->
    <circle cx="50" cy="50" r="62" fill="url(#pmBloom)"/><circle cx="50" cy="44" r="44" fill="url(#pmBloom)"/>
    <!-- ground + light pool -->
    <path d="M0 84 Q50 76 100 84 L100 100 L0 100 Z" fill="#071a14"/>
    <ellipse cx="50" cy="86" rx="44" ry="8" fill="url(#pmPool)"/>
    <!-- grass tufts -->
    <g stroke="#2ee86a" stroke-width="1" stroke-linecap="round" fill="none" opacity=".8">
      <path d="M28 86 l-2 -5 M30 86 l0 -6 M32 86 l2 -4"/><path d="M66 86 l-2 -4 M68 86 l0 -6 M70 86 l2 -5"/>
    </g>
    <!-- small companion mushroom -->
    <ellipse cx="76" cy="80" rx="9" ry="6" fill="url(#pmBloom)"/>
    <path d="M74.6 77 L74 84 L78 84 L77.4 77 Z" fill="url(#pmStem)"/>
    <path d="M70 78 Q70 71 76 71 Q82 71 82 78 Z" fill="url(#pmCap)"/>
    <!-- hero mushroom -->
    <path d="M42 58 Q40 76 38.5 84 Q38.5 88 50 88 Q61.5 88 61.5 84 Q60 76 58 58 Z" fill="url(#pmStem)"/>
    <path d="M14 56 Q14 22 50 20 Q86 22 86 56 Q86 61 79 61 L21 61 Q14 61 14 56 Z" fill="url(#pmCap)"/>
    <path d="M21 61 Q50 69 79 61 Z" fill="#22b84a"/>
    <path d="M28 62.5 Q50 68 72 62.5" fill="none" stroke="#e6fff2" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
    <path d="M26 38 Q35 26 49 25" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>
    <g fill="#0a1a3a" opacity=".78">
      <circle cx="35" cy="45" r="5"/><circle cx="61" cy="34" r="6"/><circle cx="72" cy="50" r="3.6"/><circle cx="50" cy="51" r="2.9"/>
    </g>
    <!-- fireflies / spores -->
    <g>
      <circle cx="20" cy="66" r="3.2" fill="url(#pmFly)"/><circle cx="20" cy="66" r=".8" fill="#fbffe0"/>
      <circle cx="82" cy="58" r="2.8" fill="url(#pmFly)"/><circle cx="82" cy="58" r=".7" fill="#fbffe0"/>
      <circle cx="30" cy="16" r="2.4" fill="url(#pmFly)"/><circle cx="30" cy="16" r=".6" fill="#fbffe0"/>
      <circle cx="66" cy="14" r="2" fill="url(#pmFly)"/><circle cx="66" cy="14" r=".5" fill="#fbffe0"/>
      <circle cx="12" cy="44" r="1.8" fill="url(#pmFly)"/><circle cx="90" cy="40" r="1.8" fill="url(#pmFly)"/>
    </g>
  </g>
</svg>
